<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | The Ultimate Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { 
            --accent: #d4af37; 
            --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); 
        }

        body { 
            background-color: #030303; color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden;
            cursor: none;
        }

        /* Animated Cursor Glow */
        #cursor-glow {
            width: 400px; height: 400px; background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
            position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        /* Premium 3D Card */
        .product-card {
            background: #0d0d0d; border-radius: 40px; border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d; perspective: 1000px;
        }
        .product-card:hover {
            transform: translateY(-15px) rotateX(5deg) rotateY(5deg);
            border-color: var(--accent);
            box-shadow: 0 25px 50px -12px rgba(212, 175, 55, 0.2);
        }

        /* Sidebar Glass Effect */
        .sidebar { 
            height: 100vh; width: 280px; position: fixed; left: 0; top: 0; 
            background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(40px); 
            z-index: 1000; border-right: 1px solid rgba(212, 175, 55, 0.1); 
        }
        .main-content { margin-left: 280px; padding: 40px; }

        .nav-link { 
            padding: 18px 25px; border-radius: 25px; transition: 0.4s; 
            cursor: pointer; display: flex; align-items: center; gap: 15px;
        }
        .nav-link:hover { 
            background: rgba(212, 175, 55, 0.1); transform: scale(1.05);
        }

        .gold-btn { 
            background: var(--gold-grad); color: black; font-weight: 900; 
            text-transform: uppercase; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            letter-spacing: 2px;
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .floating { animation: float 5s ease-in-out infinite; }

        input { background: #000 !important; border: 1px solid #222 !important; color: white !important; padding: 16px; border-radius: 20px; width: 100%; }
        
        #video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
    </style>
</head>
<body>

<div id="cursor-glow"></div>

<div id="video-modal" onclick="closeVideo()">
    <div class="video-container animate__animated animate__zoomIn">
        <iframe id="video-frame" class="w-full h-full rounded-3xl" frameborder="0" allow="autoplay" allowfullscreen></iframe>
    </div>
</div>

<aside class="sidebar p-8 flex flex-col justify-between">
    <div>
        <div class="mb-16 text-center floating">
            <div class="relative inline-block">
                <div class="absolute inset-0 rounded-full blur-xl bg-yellow-500/20"></div>
                <img src="https://instagram.fkhi16-2.fna.fbcdn.net/v/t51.2885-19/624808014_17848151646670722_8018140761805361040_n.jpg?efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby41MDAuYzIifQ&_nc_ht=instagram.fkhi16-2.fna.fbcdn.net&_nc_cat=106&_nc_oc=Q6cZ2QFp6joj10hXacsfbmyNwTBvjFRRAzMqn8-2kV_K6zRGRt-cRVAMK7tIJhGARkcVFTo&_nc_ohc=DVcveLJJ5coQ7kNvwG2EN4E&_nc_gid=8xKqzyeYLcmmLWk70EzmUA&edm=AP4sbd4BAAAA&ccb=7-5&oh=00_Afr6VGRgrtFaz5bJRLl8ZHAPHQa4f8Yy36XCUG4pI-bpTQ&oe=69814903&_nc_sid=7a9f4b" 
                     alt="Naqsh Logo" 
                     onerror="this.src='https://i.postimg.cc/85z1X2fV/Elegant-Wordmark-Logo-for-Naqsh-Shoes.png'"
                     class="w-32 h-32 mx-auto rounded-full border-2 border-yellow-500/30 relative z-10 object-cover shadow-2xl">
            </div>
            <h1 style="font-family: 'Syncopate';" class="text-[11px] tracking-[0.5em] text-yellow-500 font-bold mt-6">NAQSH</h1>
        </div>
        <nav class="space-y-4">
            <a onclick="showSection('home')" class="nav-link"><span class="text-[10px] font-black uppercase tracking-widest">01 // Home</span></a>
            <a onclick="showSection('products')" class="nav-link"><span class="text-[10px] font-black uppercase tracking-widest">02 // Gallery</span></a>
            <a onclick="openAdmin()" class="nav-link mt-20 opacity-20 hover:opacity-100"><span class="text-[10px] font-black uppercase tracking-widest">⚙️ System</span></a>
        </nav>
    </div>
    <div id="sidebar-contacts" class="space-y-6 pb-10"></div>
</aside>

<main class="main-content">
    <section id="home-page" class="animate__animated animate__fadeIn">
        <div class="relative h-[85vh] rounded-[60px] overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=2000')] bg-cover bg-center scale-110 animate-[pulse_10s_infinite]"></div>
            <div class="absolute inset-0 bg-black/40"></div>
            <div class="relative text-center z-10 px-6">
                <span class="text-yellow-500 tracking-[1em] text-[10px] font-bold uppercase mb-4 block">Collection 2026</span>
                <h2 style="font-family: 'Syncopate';" class="text-8xl font-black text-white mb-10 leading-none">BEYOND<br>LIMITS</h2>
                <button onclick="showSection('products')" class="gold-btn px-20 py-6 rounded-full text-xs">Enter Universe</button>
            </div>
        </div>
    </section>

    <section id="products-page" class="hidden">
        <div class="mb-20"><h2 style="font-family: 'Syncopate';" class="text-5xl font-bold">CURATED_STOCK</h2></div>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></div>
    </section>

    </main>

<script>
    // System Logic
    const glow = document.getElementById('cursor-glow');
    document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
    });

    let inventory = JSON.parse(localStorage.getItem('naqsh_data')) || [
        { id: 1, name: "Air Jordan Luxury", price: "8,500 PKR", img: "https://images.unsplash.com/photo-1584735175315-9d5df23860e6?q=80&w=500", vid: "", sold: false }
    ];
    let contacts = JSON.parse(localStorage.getItem('naqsh_contacts')) || { wa: "0370168186", ig: "naqshshoes", fb: "https://facebook.com" };

    function showSection(name) {
        ['home', 'products', 'admin'].forEach(s => {
            const el = document.getElementById(s + '-page');
            if(el) el.classList.add('hidden');
        });
        const target = document.getElementById(name + '-page');
        if(target) target.classList.remove('hidden');
        if(name === 'products') renderStore();
    }

    function renderStore() {
        const container = document.getElementById('product-list');
        container.innerHTML = inventory.map((item, idx) => `
            <div class="product-card animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.1}s">
                <div class="h-96 overflow-hidden rounded-t-[40px] relative">
                    <img src="${item.img}" class="w-full h-full object-cover">
                    ${item.sold ? '<div class="absolute inset-0 bg-black/80 flex items-center justify-center font-bold text-red-500 tracking-widest">SOLD</div>' : ''}
                </div>
                <div class="p-10">
                    <h3 class="text-xl font-bold mb-4">${item.name}</h3>
                    <div class="flex justify-between items-center">
                        <span class="text-yellow-500 font-bold">${item.price}</span>
                        <a href="https://wa.me/${contacts.wa}" class="gold-btn px-6 py-2 rounded-lg text-[10px]">Buy</a>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderContacts() {
        document.getElementById('sidebar-contacts').innerHTML = `
            <a href="https://wa.me/${contacts.wa}" target="_blank" class="flex items-center gap-4 text-[9px] font-black opacity-30 hover:opacity-100 hover:text-yellow-500 transition-all uppercase tracking-widest">WhatsApp</a>
            <a href="https://instagram.com/${contacts.ig}" target="_blank" class="flex items-center gap-4 text-[9px] font-black opacity-30 hover:opacity-100 hover:text-yellow-500 transition-all uppercase tracking-widest">Instagram</a>
        `;
    }

    window.onload = () => { renderContacts(); showSection('home'); }
</script>
</body>
</html>
