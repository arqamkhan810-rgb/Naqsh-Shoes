<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | God Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --accent: #d4af37; --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); }
        body { background-color: #030303; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }

        /* --- LUXURY ANIMATIONS --- */
        .glass-sidebar {
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(50px);
            border-right: 1px solid rgba(212, 175, 55, 0.1);
        }

        .product-card {
            background: #080808; border-radius: 40px; border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .product-card:hover { transform: translateY(-15px); border-color: var(--accent); }

        /* SOLD OUT STYLING */
        .is-sold-out { filter: grayscale(1) brightness(0.5); }
        .sold-badge {
            position: absolute; top: 25px; left: 25px;
            background: #ff0000; color: #fff; padding: 6px 15px;
            font-size: 9px; font-weight: 900; border-radius: 8px;
            z-index: 50; letter-spacing: 2px; box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }

        /* LOGO ROTATION */
        .logo-spin { animation: spin 8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .gold-btn {
            background: var(--gold-grad); color: #000; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .gold-btn:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(212,175,55,0.3); }

        input {
            background: #000 !important; border: 1px solid #222 !important;
            color: white !important; padding: 16px; border-radius: 15px; width: 100%;
        }
        input:focus { border-color: var(--accent) !important; outline: none; }

        .nav-link { transition: 0.3s; cursor: pointer; opacity: 0.4; font-size: 10px; font-weight: 800; letter-spacing: 2px; }
        .nav-link.active, .nav-link:hover { opacity: 1; color: var(--accent); }

        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="p-10 w-96 bg-[#080808] border border-yellow-500/20 rounded-[40px] text-center animate__animated animate__zoomIn">
        <h2 style="font-family: 'Syncopate';" class="text-xs font-bold mb-8 text-yellow-500 tracking-[0.5em]">SECURITY_CHECK</h2>
        <input type="text" id="id-entry" placeholder="ID" class="mb-4">
        <input type="password" id="key-entry" placeholder="KEY" class="mb-8">
        <button onclick="unlockSystem()" class="w-full gold-btn py-4 rounded-xl">Unlock</button>
        <button onclick="closeLogin()" class="mt-6 text-gray-600 text-[9px] uppercase block w-full">Cancel</button>
    </div>
</div>

<aside class="glass-sidebar w-[280px] h-screen fixed left-0 top-0 p-10 flex flex-col justify-between z-[1000]">
    <div class="animate__animated animate__fadeInDown">
        <div class="relative w-28 h-28 mx-auto mb-8">
            <div class="absolute inset-0 border border-yellow-500/30 rounded-full logo-spin"></div>
            <div class="absolute inset-2 bg-black rounded-full p-2 border border-white/10 overflow-hidden">
                <img src="https://instagram.fkhi16-2.fna.fbcdn.net/v/t51.2885-19/624808014_17848151646670722_8018140761805361040_n.jpg?efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby41MDAuYzIifQ&_nc_ht=instagram.fkhi16-2.fna.fbcdn.net&_nc_cat=106&_nc_oc=Q6cZ2QFp6joj10hXacsfbmyNwTBvjFRRAzMqn8-2kV_K6zRGRt-cRVAMK7tIJhGARkcVFTo&_nc_ohc=DVcveLJJ5coQ7kNvwG2EN4E&_nc_gid=8xKqzyeYLcmmLWk70EzmUA&edm=AP4sbd4BAAAA&ccb=7-5&oh=00_Afr6VGRgrtFaz5bJRLl8ZHAPHQa4f8Yy36XCUG4pI-bpTQ&oe=69814903&_nc_sid=7a9f4b" class="w-full h-full object-cover rounded-full">
            </div>
        </div>
        <nav class="space-y-6 mt-16">
            <a onclick="navigate('home')" id="nav-home" class="nav-link active block uppercase">01 / Home</a>
            <a onclick="navigate('gallery')" id="nav-gallery" class="nav-link block uppercase">02 / Vault</a>
            <a onclick="openLogin()" class="nav-link block uppercase mt-20 opacity-20 hover:opacity-100">03 / System</a>
        </nav>
    </div>
    <div id="contact-hooks" class="space-y-3 pb-6 border-t border-white/5 pt-8 animate__animated animate__fadeInUp"></div>
</aside>

<main class="ml-[280px] p-12">
    <section id="home-sec" class="page-sec animate__animated animate__fadeIn">
        <div class="h-[85vh] rounded-[50px] relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=2000')] bg-cover bg-center transition-transform duration-[10s] hover:scale-110"></div>
            <div class="absolute inset-0 bg-black/50"></div>
            <div class="relative z-10 text-center">
                <span class="text-yellow-500 font-bold tracking-[1em] text-[9px] uppercase mb-4 block">Handcrafted Excellence</span>
                <h2 style="font-family: 'Syncopate';" class="text-7xl font-black mb-10 leading-none">THE NAQSH<br>COLLECTION</h2>
                <button onclick="navigate('gallery')" class="gold-btn px-12 py-5 rounded-full text-[10px]">Enter Gallery</button>
            </div>
        </div>
    </section>

    <section id="gallery-sec" class="page-sec hidden animate__animated animate__fadeIn">
        <h2 style="font-family: 'Syncopate';" class="text-3xl font-bold mb-12 text-yellow-500">AVAILABLE_ASSETS</h2>
        <div id="store-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </section>

    <section id="admin-sec" class="page-sec hidden animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-12">
            <h2 style="font-family: 'Syncopate';" class="text-xl text-yellow-500">DASHBOARD</h2>
            <button onclick="navigate('home')" class="bg-red-500/20 text-red-500 px-6 py-2 rounded-lg text-[9px] font-bold">EXIT</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="bg-[#080808] p-8 rounded-[30px] border border-white/5">
                <h3 class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-6">Register New Stock</h3>
                <input type="text" id="shoe-name" placeholder="Shoe Name" class="mb-3">
                <input type="text" id="shoe-price" placeholder="Price (PKR)" class="mb-3">
                <input type="text" id="shoe-img" placeholder="Direct Image URL" class="mb-6">
                <button onclick="addNewProduct()" class="w-full gold-btn py-4 rounded-xl mb-10">Add to Vault</button>
                
                <div id="admin-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div>
            </div>

            <div class="bg-[#080808] p-8 rounded-[30px] border border-white/5 h-fit">
                <h3 class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-6">Identity Configuration</h3>
                <label class="text-[9px] text-yellow-500 font-bold mb-2 block uppercase">WhatsApp Number</label>
                <input type="text" id="set-wa" class="mb-4">
                <label class="text-[9px] text-yellow-500 font-bold mb-2 block uppercase">Instagram Username</label>
                <input type="text" id="set-ig" class="mb-4">
                <label class="text-[9px] text-yellow-500 font-bold mb-2 block uppercase">Facebook Link</label>
                <input type="text" id="set-fb" class="mb-6">
                <button onclick="saveIdentity()" class="w-full border border-yellow-500/30 text-yellow-500 py-4 rounded-xl font-black text-[9px] hover:bg-yellow-500 hover:text-black transition uppercase">Update Channels</button>
            </div>
        </div>
    </section>
</main>

<script>
    // --- DATABASE ---
    let products = JSON.parse(localStorage.getItem('naqsh_db_v2')) || [];
    let config = JSON.parse(localStorage.getItem('naqsh_config_v2')) || {
        wa: "0370168186",
        ig: "naqshshoes",
        fb: "https://facebook.com/naqshshoes"
    };

    // --- NAVIGATION ---
    function navigate(page) {
        document.querySelectorAll('.page-sec').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(page + '-sec').classList.remove('hidden');
        document.getElementById('nav-' + page)?.classList.add('active');
        
        if(page === 'gallery') renderGallery();
        if(page === 'admin') { renderAdminList(); syncAdminFields(); }
    }

    // --- AUTH ---
    function openLogin() { document.getElementById('login-overlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('login-overlay').style.display = 'none'; }
    function unlockSystem() {
        if(document.getElementById('id-entry').value === "NaqshShoes" && document.getElementById('key-entry').value === "Gixxer1000") {
            closeLogin(); navigate('admin');
        } else { alert("WRONG KEY"); }
    }

    // --- CORE LOGIC ---
    function addNewProduct() {
        const name = document.getElementById('shoe-name').value;
        const price = document.getElementById('shoe-price').value;
        const img = document.getElementById('shoe-img').value;
        if(name && price && img) {
            products.unshift({ id: Date.now(), name, price, img, sold: false });
            saveData(); renderAdminList();
            ['shoe-name', 'shoe-price', 'shoe-img'].forEach(id => document.getElementById(id).value = '');
        }
    }

    function toggleSold(id) {
        const item = products.find(p => p.id === id);
        if(item) {
            item.sold = !item.sold;
            saveData();
            renderAdminList();
            alert(`Asset marked as ${item.sold ? 'SOLD' : 'AVAILABLE'}`);
        }
    }

    function deleteProduct(id) {
        if(confirm("Delete permanently?")) {
            products = products.filter(p => p.id !== id);
            saveData(); renderAdminList();
        }
    }

    function syncAdminFields() {
        document.getElementById('set-wa').value = config.wa;
        document.getElementById('set-ig').value = config.ig;
        document.getElementById('set-fb').value = config.fb;
    }

    function saveIdentity() {
        config.wa = document.getElementById('set-wa').value;
        config.ig = document.getElementById('set-ig').value;
        config.fb = document.getElementById('set-fb').value;
        localStorage.setItem('naqsh_config_v2', JSON.stringify(config));
        renderSidebar();
        alert("CHANNELS UPDATED");
    }

    // --- RENDERING ---
    function renderGallery() {
        const grid = document.getElementById('store-grid');
        grid.innerHTML = products.map((p, i) => `
            <div class="product-card group animate__animated animate__fadeInUp" style="animation-delay: ${i*0.1}s">
                <div class="h-[400px] overflow-hidden rounded-[35px] relative">
                    ${p.sold ? '<div class="sold-badge">SOLD OUT</div>' : ''}
                    <img src="${p.img}" class="w-full h-full object-cover transition-transform duration-[2s] group-hover:scale-110 ${p.sold ? 'is-sold-out' : ''}">
                    ${!p.sold ? `
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center p-6">
                        <a href="https://wa.me/${config.wa}?text=I am interested in ${p.name}" target="_blank" class="gold-btn w-full py-4 rounded-xl text-center text-[9px]">Buy via WhatsApp</a>
                    </div>` : ''}
                </div>
                <div class="p-6 text-center">
                    <h3 class="text-[9px] font-bold uppercase tracking-widest text-gray-500 mb-1">${p.name}</h3>
                    <p class="text-xl font-black ${p.sold ? 'text-gray-700' : 'text-yellow-500'}">${p.price}</p>
                </div>
            </div>
        `).join('');
    }

    function renderAdminList() {
        const list = document.getElementById('admin-list');
        list.innerHTML = products.map(p => `
            <div class="flex items-center justify-between p-4 bg-black rounded-2xl border border-white/5">
                <div class="flex items-center gap-3">
                    <img src="${p.img}" class="w-10 h-10 rounded-lg object-cover ${p.sold ? 'grayscale' : ''}">
                    <span class="text-[9px] font-bold uppercase ${p.sold ? 'text-red-500' : 'text-gray-400'}">${p.name}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleSold(${p.id})" class="text-[8px] font-black px-3 py-2 rounded-lg border ${p.sold ? 'bg-yellow-500 text-black' : 'border-yellow-500/30 text-yellow-500'}">
                        ${p.sold ? 'RE-STOCK' : 'MARK SOLD'}
                    </button>
                    <button onclick="deleteProduct(${p.id})" class="text-red-500 p-2 text-[10px]">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function renderSidebar() {
        document.getElementById('contact-hooks').innerHTML = `
            <a href="https://wa.me/${config.wa}" target="_blank" class="text-[8px] font-black text-gray-600 hover:text-yellow-500 tracking-widest block uppercase">WhatsApp</a>
            <a href="https://instagram.com/${config.ig}" target="_blank" class="text-[8px] font-black text-gray-600 hover:text-yellow-500 tracking-widest block uppercase">Instagram</a>
            <a href="${config.fb}" target="_blank" class="text-[8px] font-black text-gray-600 hover:text-yellow-500 tracking-widest block uppercase">Facebook</a>
        `;
    }

    function saveData() { localStorage.setItem('naqsh_db_v2', JSON.stringify(products)); }

    window.onload = () => { renderSidebar(); navigate('home'); }
</script>
</body>
</html>
