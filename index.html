<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | The Ultimate Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { 
            --accent: #d4af37; 
            --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); 
        }

        body { 
            background-color: #030303; color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden;
            cursor: none; /* Custom cursor loading */
        }

        /* Custom Animated Cursor */
        #cursor-glow {
            width: 400px; height: 400px; background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
            position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        /* 3D Tilt Card Effect */
        .product-card {
            background: #0d0d0d; border-radius: 40px; border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d; perspective: 1000px;
        }
        .product-card:hover {
            transform: translateY(-15px) rotateX(5deg) rotateY(5deg);
            border-color: var(--accent);
            box-shadow: 0 25px 50px -12px rgba(212, 175, 55, 0.2);
        }

        /* Ultimate Shine */
        .shine-box { position: relative; overflow: hidden; border-radius: 40px 40px 0 0; }
        .shine-box::after {
            content: ''; position: absolute; top: -100%; left: -100%; width: 50%; height: 300%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); transition: 0.8s;
        }
        .product-card:hover .shine-box::after { left: 150%; top: -50%; }

        /* Sidebar Glassmorphism */
        .sidebar { 
            height: 100vh; width: 280px; position: fixed; left: 0; top: 0; 
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(40px); 
            z-index: 1000; border-right: 1px solid rgba(212, 175, 55, 0.1); 
        }
        .main-content { margin-left: 280px; padding: 40px; }

        .nav-link { 
            padding: 18px 25px; border-radius: 25px; transition: 0.4s; 
            cursor: pointer; display: flex; align-items: center; gap: 15px;
            border: 1px solid transparent;
        }
        .nav-link:hover { 
            background: rgba(212, 175, 55, 0.1); border-color: rgba(212, 175, 55, 0.3);
            transform: scale(1.05);
        }

        .gold-btn { 
            background: var(--gold-grad); color: black; font-weight: 900; 
            text-transform: uppercase; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            letter-spacing: 2px;
        }
        .gold-btn:hover { transform: scale(1.1); filter: contrast(1.2); }

        /* Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 4s ease-in-out infinite; }

        input { background: #000 !important; border: 1px solid #222 !important; color: white !important; padding: 16px; border-radius: 20px; width: 100%; transition: 0.3s; }
        input:focus { border-color: var(--accent) !important; box-shadow: 0 0 15px rgba(212,175,55,0.1); }

        #video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
    </style>
</head>
<body>

<div id="cursor-glow"></div>

<div id="video-modal" onclick="closeVideo()">
    <div class="video-container animate__animated animate__zoomIn">
        <iframe id="video-frame" class="w-full h-full rounded-3xl" frameborder="0" allow="autoplay" allowfullscreen></iframe>
    </div>
</div>

<div id="login-overlay" class="fixed inset-0 bg-black/95 z-[2000] hidden items-center justify-center animate__animated animate__fadeIn">
    <div class="glass-panel p-12 w-96 text-center animate__animated animate__jackInTheBox">
        <h2 style="font-family: 'Syncopate';" class="text-2xl font-bold mb-10 text-yellow-500">AUTH_MODE</h2>
        <input type="text" id="admin-user" placeholder="ID" class="mb-4">
        <input type="password" id="admin-pass" placeholder="KEY" class="mb-10">
        <button onclick="attemptLogin()" class="w-full gold-btn py-5 rounded-2xl">Initialize</button>
        <button onclick="closeLogin()" class="mt-6 text-gray-500 text-xs tracking-widest">ABORT</button>
    </div>
</div>

<aside class="sidebar p-8 flex flex-col justify-between">
    <div>
        <div class="mb-16 text-center floating">
            <img src="https://i.postimg.cc/85z1X2fV/Elegant-Wordmark-Logo-for-Naqsh-Shoes.png" class="w-28 h-28 mx-auto rounded-full border-2 border-yellow-500/20 mb-6 object-cover shadow-[0_0_30px_rgba(212,175,55,0.1)]">
            <h1 style="font-family: 'Syncopate';" class="text-[11px] tracking-[0.5em] text-yellow-500 font-bold">NAQSH</h1>
        </div>
        <nav class="space-y-4">
            <a onclick="showSection('home')" class="nav-link"><span class="text-[10px] font-black uppercase tracking-widest">01 // Home</span></a>
            <a onclick="showSection('products')" class="nav-link"><span class="text-[10px] font-black uppercase tracking-widest">02 // Gallery</span></a>
            <a onclick="openAdmin()" class="nav-link mt-20 opacity-20 hover:opacity-100"><span class="text-[10px] font-black uppercase tracking-widest">⚙️ System</span></a>
        </nav>
    </div>
    <div id="sidebar-contacts" class="space-y-6 pb-10"></div>
</aside>

<main class="main-content">
    <section id="home-page" class="animate__animated animate__fadeIn">
        <div class="relative h-[85vh] rounded-[60px] overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=2000')] bg-cover bg-center scale-110 animate-[pulse_10s_infinite]"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
            <div class="relative text-center z-10 px-6">
                <span class="text-yellow-500 tracking-[1em] text-[10px] font-bold uppercase mb-4 block animate__animated animate__fadeInDown">Collection 2026</span>
                <h2 style="font-family: 'Syncopate';" class="text-8xl font-black text-white mb-10 leading-none animate__animated animate__zoomIn">BEYOND<br>LIMITS</h2>
                <button onclick="showSection('products')" class="gold-btn px-20 py-6 rounded-full text-xs">Enter Universe</button>
            </div>
        </div>
    </section>

    <section id="products-page" class="hidden">
        <div class="flex justify-between items-end mb-20 animate__animated animate__fadeInLeft">
            <div>
                <span class="text-yellow-500 text-[10px] font-bold tracking-[0.3em] uppercase">The Vault</span>
                <h2 style="font-family: 'Syncopate';" class="text-5xl font-bold">CURATED_STOCK</h2>
            </div>
        </div>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></div>
    </section>

    <section id="admin-page" class="hidden">
        <div class="flex justify-between items-center mb-16 animate__animated animate__slideInDown">
            <h2 style="font-family: 'Syncopate';" class="text-3xl font-bold text-yellow-500">COMMAND_CENTER</h2>
            <button onclick="showSection('home')" class="bg-red-500/10 text-red-500 border border-red-500/20 px-8 py-3 rounded-full text-[10px] font-black tracking-widest hover:bg-red-500 hover:text-white transition">SHUTDOWN</button>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <div class="space-y-8 animate__animated animate__fadeInLeft">
                <div class="bg-[#0a0a0a] p-10 rounded-[40px] border border-white/5">
                    <h3 class="text-[10px] font-bold text-yellow-500 mb-8 tracking-[0.3em] uppercase">Link Management</h3>
                    <input type="text" id="edit-wa" placeholder="WhatsApp Number" class="mb-4">
                    <input type="text" id="edit-ig" placeholder="Instagram ID" class="mb-4">
                    <input type="text" id="edit-fb" placeholder="Facebook Link" class="mb-8">
                    <button onclick="saveContacts()" class="w-full gold-btn py-4 rounded-2xl text-[10px]">Update Matrix</button>
                </div>
                <div class="bg-[#0a0a0a] p-10 rounded-[40px] border border-white/5">
                    <h3 class="text-[10px] font-bold text-yellow-500 mb-8 tracking-[0.3em] uppercase">Stock Injection</h3>
                    <input type="text" id="p-name" placeholder="MODEL" class="mb-4">
                    <input type="text" id="p-price" placeholder="PRICE" class="mb-4">
                    <input type="text" id="p-img" placeholder="IMAGE URL" class="mb-4">
                    <input type="text" id="p-vid" placeholder="VIDEO URL" class="mb-8">
                    <button onclick="saveProduct()" class="w-full gold-btn py-4 rounded-2xl text-[10px]">Deploy Stock</button>
                </div>
            </div>
            <div class="lg:col-span-2 bg-[#0a0a0a] p-10 rounded-[40px] border border-white/5 animate__animated animate__fadeInRight">
                <h3 class="text-[10px] font-bold text-yellow-500 mb-10 tracking-[0.3em] uppercase">Active Inventory</h3>
                <div id="admin-list" class="space-y-6"></div>
            </div>
        </div>
    </section>
</main>

<script>
    let inventory = JSON.parse(localStorage.getItem('naqsh_data')) || [
        { id: 1, name: "Air Jordan Luxury", price: "8,500 PKR", img: "https://images.unsplash.com/photo-1584735175315-9d5df23860e6?q=80&w=500", vid: "", sold: false }
    ];

    let contacts = JSON.parse(localStorage.getItem('naqsh_contacts')) || { wa: "0370168186", ig: "naqshshoes", fb: "https://facebook.com" };

    // Ultimate Mouse Glow
    const glow = document.getElementById('cursor-glow');
    document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
    });

    function showSection(name) {
        ['home', 'products', 'admin'].forEach(s => document.getElementById(s + '-page').classList.add('hidden'));
        const target = document.getElementById(name + '-page');
        target.classList.remove('hidden');
        if(name === 'products') renderStore();
        if(name === 'admin') renderAdmin();
    }

    function renderStore() {
        const container = document.getElementById('product-list');
        container.innerHTML = inventory.map((item, idx) => `
            <div class="product-card animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.15}s">
                <div class="h-96 shine-box">
                    <img src="${item.img}" class="w-full h-full object-cover transition duration-700 hover:scale-110">
                    ${item.vid ? `<button onclick="openVideo('${item.vid}')" class="absolute top-6 right-6 bg-black/50 backdrop-blur-xl p-4 rounded-full border border-yellow-500/40 hover:bg-yellow-500 hover:text-black transition-all z-30">🎥</button>` : ''}
                    ${item.sold ? '<div class="absolute inset-0 bg-black/90 flex items-center justify-center font-bold text-red-500 text-[10px] tracking-[0.8em] z-20">OUT OF STOCK</div>' : ''}
                </div>
                <div class="p-10">
                    <p class="text-gray-500 text-[9px] font-bold tracking-[0.3em] mb-2 uppercase">Official Issue</p>
                    <h3 class="text-xl font-bold mb-6 tracking-tight">${item.name}</h3>
                    <div class="flex items-center justify-between">
                        <span class="text-yellow-500 font-black text-xl">${item.price}</span>
                        ${item.sold ? '' : `<a href="https://wa.me/${contacts.wa}?text=Order: ${item.name}" target="_blank" class="gold-btn px-8 py-3 rounded-xl text-[10px]">Order</a>`}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderAdmin() {
        const list = document.getElementById('admin-list');
        list.innerHTML = inventory.map(item => `
            <div class="flex items-center justify-between p-6 bg-black/60 border border-white/5 rounded-3xl hover:border-yellow-500/30 transition">
                <div class="flex items-center gap-6">
                    <img src="${item.img}" class="w-16 h-16 rounded-2xl object-cover">
                    <div>
                        <p class="text-[12px] font-bold uppercase tracking-widest">${item.name}</p>
                        <p class="text-yellow-500 font-bold">${item.price}</p>
                    </div>
                </div>
                <div class="flex gap-4">
                    <button onclick="toggleSold(${item.id})" class="px-6 py-2 rounded-xl text-[10px] font-black border ${item.sold ? 'border-green-500 text-green-500' : 'border-red-500 text-red-500'}">
                        ${item.sold ? 'RESTOCK' : 'MARK SOLD'}
                    </button>
                    <button onclick="deleteItem(${item.id})" class="p-4 bg-white/5 rounded-xl hover:bg-red-600 transition">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    // Video Control
    function openVideo(url) {
        document.getElementById('video-frame').src = url;
        document.getElementById('video-modal').style.display = 'flex';
    }
    function closeVideo() {
        document.getElementById('video-modal').style.display = 'none';
        document.getElementById('video-frame').src = '';
    }

    // Admin Functions
    function openAdmin() { document.getElementById('login-overlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('login-overlay').style.display = 'none'; }
    function attemptLogin() {
        if(document.getElementById('admin-user').value === "NaqshShoes" && document.getElementById('admin-pass').value === "Gixxer1000") {
            closeLogin(); showSection('admin');
        } else { alert("SYSTEM OVERRIDE DETECTED: Access Denied"); }
    }

    function saveProduct() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const img = document.getElementById('p-img').value;
        const vid = document.getElementById('p-vid').value;
        if(name && price && img) {
            inventory.unshift({ id: Date.now(), name, price, img, vid, sold: false });
            updateData();
            ['p-name', 'p-price', 'p-img', 'p-vid'].forEach(id => document.getElementById(id).value = '');
        }
    }

    function saveContacts() {
        contacts.wa = document.getElementById('edit-wa').value;
        contacts.ig = document.getElementById('edit-ig').value;
        contacts.fb = document.getElementById('edit-fb').value;
        localStorage.setItem('naqsh_contacts', JSON.stringify(contacts));
        renderContacts();
        alert("CHANNELS RECONFIGURED");
    }

    function renderContacts() {
        document.getElementById('sidebar-contacts').innerHTML = `
            <a href="https://wa.me/${contacts.wa}" target="_blank" class="flex items-center gap-4 text-[9px] font-black opacity-30 hover:opacity-100 hover:text-yellow-500 transition-all uppercase tracking-[0.3em]">WA.Internal</a>
            <a href="https://instagram.com/${contacts.ig}" target="_blank" class="flex items-center gap-4 text-[9px] font-black opacity-30 hover:opacity-100 hover:text-yellow-500 transition-all uppercase tracking-[0.3em]">IG.Visuals</a>
            <a href="${contacts.fb}" target="_blank" class="flex items-center gap-4 text-[9px] font-black opacity-30 hover:opacity-100 hover:text-yellow-500 transition-all uppercase tracking-[0.3em]">FB.Network</a>
        `;
        document.getElementById('edit-wa').value = contacts.wa;
        document.getElementById('edit-ig').value = contacts.ig;
        document.getElementById('edit-fb').value = contacts.fb;
    }

    function updateData() { localStorage.setItem('naqsh_data', JSON.stringify(inventory)); renderAdmin(); }
    function toggleSold(id) { let item = inventory.find(i => i.id === id); item.sold = !item.sold; updateData(); }
    function deleteItem(id) { if(confirm("Purge Asset?")) { inventory = inventory.filter(i => i.id !== id); updateData(); } }

    window.onload = () => { renderContacts(); showSection('home'); }
</script>
</body>
</html>
