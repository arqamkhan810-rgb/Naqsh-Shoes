<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | God Mode UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --accent: #d4af37; --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); }
        body { background-color: #020202; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }

        /* --- ADVANCED ANIMATIONS --- */
        .glass-sidebar {
            background: rgba(4, 4, 4, 0.9); backdrop-filter: blur(50px);
            border-right: 1px solid rgba(212, 175, 55, 0.1);
            animation: slideInLeft 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .product-card {
            background: #080808; border-radius: 40px; border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .product-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 30px 60px -12px rgba(212, 175, 55, 0.2);
        }

        .sold-out-overlay {
            filter: grayscale(1) contrast(0.8);
            pointer-events: none;
        }
        .sold-badge {
            position: absolute; top: 30px; right: 30px;
            background: #ff0000; color: white; padding: 8px 20px;
            font-size: 10px; font-weight: 900; border-radius: 10px;
            z-index: 50; letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255,0,0,0.4);
        }

        /* --- LOGO ENGINE --- */
        .logo-ring {
            position: absolute; inset: 0; border: 1px solid rgba(212,175,55,0.3);
            border-top: 2px solid var(--accent); border-radius: 50%;
            animation: spin 3s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- UI COMPONENETS --- */
        .gold-btn {
            background: var(--gold-grad); color: #000; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.4s;
        }
        .gold-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(212,175,55,0.3); }

        input {
            background: #050505 !important; border: 1px solid #1a1a1a !important;
            color: white !important; padding: 18px; border-radius: 20px; outline: none;
        }
        input:focus { border-color: var(--accent) !important; }

        .nav-link { transition: 0.4s; cursor: pointer; color: #555; position: relative; }
        .nav-link:hover, .nav-link.active { color: var(--accent); padding-left: 10px; }
        .nav-link.active::before { content: '>'; position: absolute; left: -10px; color: var(--accent); }

        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.99); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(30px); }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="p-12 w-96 text-center animate__animated animate__zoomIn">
        <h2 style="font-family: 'Syncopate';" class="text-xl font-bold mb-10 text-yellow-500 tracking-[0.4em]">ADMIN_PORTAL</h2>
        <input type="text" id="id-entry" placeholder="SYSTEM ID" class="w-full mb-4">
        <input type="password" id="key-entry" placeholder="SECURITY KEY" class="w-full mb-8">
        <button onclick="unlockSystem()" class="w-full gold-btn py-5 rounded-2xl">Initialize</button>
        <button onclick="closeLogin()" class="mt-6 text-gray-700 text-[10px] tracking-widest uppercase block w-full">Cancel</button>
    </div>
</div>

<aside class="glass-sidebar w-[300px] h-screen fixed left-0 top-0 p-12 flex flex-col justify-between z-[1000]">
    <div>
        <div class="relative w-32 h-32 mx-auto mb-10">
            <div class="logo-ring"></div>
            <div class="absolute inset-2 bg-black rounded-full p-3 border border-white/5 overflow-hidden">
                <img src="https://instagram.fkhi16-2.fna.fbcdn.net/v/t51.2885-19/624808014_17848151646670722_8018140761805361040_n.jpg?efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby41MDAuYzIifQ&_nc_ht=instagram.fkhi16-2.fna.fbcdn.net&_nc_cat=106&_nc_oc=Q6cZ2QFp6joj10hXacsfbmyNwTBvjFRRAzMqn8-2kV_K6zRGRt-cRVAMK7tIJhGARkcVFTo&_nc_ohc=DVcveLJJ5coQ7kNvwG2EN4E&_nc_gid=8xKqzyeYLcmmLWk70EzmUA&edm=AP4sbd4BAAAA&ccb=7-5&oh=00_Afr6VGRgrtFaz5bJRLl8ZHAPHQa4f8Yy36XCUG4pI-bpTQ&oe=69814903&_nc_sid=7a9f4b" class="w-full h-full object-contain rounded-full">
            </div>
        </div>
        <h1 style="font-family: 'Syncopate';" class="text-center text-yellow-500 font-bold tracking-[0.5em] text-[10px] mb-16">NAQSH ELITE</h1>
        
        <nav class="space-y-8">
            <a onclick="navigate('home')" id="nav-home" class="nav-link block font-black text-[10px] uppercase tracking-[0.3em]">Home</a>
            <a onclick="navigate('gallery')" id="nav-gallery" class="nav-link block font-black text-[10px] uppercase tracking-[0.3em]">Vault</a>
            <a onclick="openLogin()" class="nav-link block font-black text-[10px] uppercase tracking-[0.3em] mt-24 opacity-30 hover:opacity-100">Terminal</a>
        </nav>
    </div>

    <div id="contact-hooks" class="space-y-4 pb-8 border-t border-white/5 pt-10"></div>
</aside>

<main class="ml-[300px] p-16">
    <section id="home-sec" class="page-sec">
        <div class="relative h-[80vh] rounded-[60px] overflow-hidden group animate__animated animate__fadeIn">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=2000')] bg-cover bg-center group-hover:scale-110 transition-transform duration-[3s]"></div>
            <div class="absolute inset-0 bg-black/60"></div>
            <div class="relative h-full flex flex-col justify-center items-center text-center">
                <h2 style="font-family: 'Syncopate';" class="text-8xl font-bold mb-10 tracking-tighter">UNMATCHED<br>STEP</h2>
                <button onclick="navigate('gallery')" class="gold-btn px-16 py-6 rounded-2xl text-[10px]">Access Gallery</button>
            </div>
        </div>
    </section>

    <section id="gallery-sec" class="page-sec hidden">
        <h2 style="font-family: 'Syncopate';" class="text-4xl font-bold mb-16 animate__animated animate__fadeInDown">LATEST_ASSETS</h2>
        <div id="store-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></div>
    </section>

    <section id="admin-sec" class="page-sec hidden">
        <div class="flex justify-between items-center mb-16">
            <h2 style="font-family: 'Syncopate';" class="text-2xl text-yellow-500">MANAGEMENT</h2>
            <button onclick="navigate('home')" class="text-red-500 font-bold text-[10px] tracking-widest">LOGOUT</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div class="bg-white/5 p-10 rounded-[40px] border border-white/10">
                <h3 class="text-[10px] font-black tracking-widest uppercase mb-10 text-gray-500">Add New Shoe</h3>
                <input type="text" id="shoe-name" placeholder="Name" class="w-full mb-4">
                <input type="text" id="shoe-price" placeholder="Price" class="w-full mb-4">
                <input type="text" id="shoe-img" placeholder="Image URL" class="w-full mb-8">
                <button onclick="addNewProduct()" class="w-full gold-btn py-5 rounded-2xl">Upload Asset</button>
                
                <div id="admin-list" class="mt-12 space-y-4 max-h-[400px] overflow-y-auto pr-2"></div>
            </div>

            <div class="bg-white/5 p-10 rounded-[40px] border border-white/10 h-fit">
                <h3 class="text-[10px] font-black tracking-widest uppercase mb-10 text-gray-500">Edit Contact Info</h3>
                <input type="text" id="set-wa" placeholder="WhatsApp (e.g. 0300...)" class="w-full mb-4">
                <input type="text" id="set-ig" placeholder="Instagram Username" class="w-full mb-4">
                <input type="text" id="set-fb" placeholder="Facebook Profile Link" class="w-full mb-8">
                <button onclick="saveIdentity()" class="w-full border border-yellow-500/30 text-yellow-500 py-5 rounded-2xl font-black text-[10px] hover:bg-yellow-500 hover:text-black transition">Save Identity</button>
            </div>
        </div>
    </section>
</main>

<script>
    let products = JSON.parse(localStorage.getItem('naqsh_prods')) || [];
    let identity = JSON.parse(localStorage.getItem('naqsh_id')) || { wa: "0370168186", ig: "naqshshoes", fb: "#" };

    function navigate(page) {
        document.querySelectorAll('.page-sec').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(page + '-sec').classList.remove('hidden');
        document.getElementById('nav-' + page)?.classList.add('active');
        if(page === 'gallery') renderGallery();
        if(page === 'admin') { renderAdminList(); syncAdminFields(); }
    }

    function openLogin() { document.getElementById('login-overlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('login-overlay').style.display = 'none'; }
    function unlockSystem() {
        if(document.getElementById('id-entry').value === "NaqshShoes" && document.getElementById('key-entry').value === "Gixxer1000") {
            closeLogin(); navigate('admin');
        } else { alert("ACCESS DENIED"); }
    }

    function addNewProduct() {
        const name = document.getElementById('shoe-name').value;
        const price = document.getElementById('shoe-price').value;
        const img = document.getElementById('shoe-img').value;
        if(name && price && img) {
            products.unshift({ id: Date.now(), name, price, img, soldOut: false });
            saveDB(); renderAdminList();
            ['shoe-name', 'shoe-price', 'shoe-img'].forEach(i => document.getElementById(i).value = '');
        }
    }

    function toggleSold(id) {
        const prod = products.find(p => p.id === id);
        if(prod) {
            prod.soldOut = !prod.soldOut;
            saveDB(); renderAdminList();
        }
    }

    function deleteProduct(id) {
        if(confirm("Delete item?")) { products = products.filter(p => p.id !== id); saveDB(); renderAdminList(); }
    }

    function syncAdminFields() {
        document.getElementById('set-wa').value = identity.wa;
        document.getElementById('set-ig').value = identity.ig;
        document.getElementById('set-fb').value = identity.fb;
    }

    function saveIdentity() {
        identity.wa = document.getElementById('set-wa').value;
        identity.ig = document.getElementById('set-ig').value;
        identity.fb = document.getElementById('set-fb').value;
        localStorage.setItem('naqsh_id', JSON.stringify(identity));
        loadHooks(); alert("Identity Updated!");
    }

    function renderGallery() {
        const grid = document.getElementById('store-grid');
        grid.innerHTML = products.map((p, idx) => `
            <div class="product-card group animate__animated animate__zoomIn" style="animation-delay: ${idx * 0.1}s">
                <div class="h-[450px] overflow-hidden rounded-[40px] relative ${p.soldOut ? 'sold-out-overlay' : ''}">
                    ${p.soldOut ? '<div class="sold-badge">OUT OF STOCK</div>' : ''}
                    <img src="${p.img}" class="w-full h-full object-cover transition-transform duration-[2s] group-hover:scale-110">
                    ${!p.soldOut ? `
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center">
                        <a href="https://wa.me/${identity.wa}?text=I want to buy ${p.name}" target="_blank" class="gold-btn px-10 py-4 rounded-xl text-[10px]">Buy via WhatsApp</a>
                    </div>` : ''}
                </div>
                <div class="p-8 text-center">
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500 mb-2">${p.name}</p>
                    <p class="text-2xl font-black ${p.soldOut ? 'text-gray-600 line-through' : 'text-yellow-500'}">${p.price}</p>
                </div>
            </div>
        `).join('');
    }

    function renderAdminList() {
        document.getElementById('admin-list').innerHTML = products.map(p => `
            <div class="flex items-center justify-between p-4 bg-black/50 border border-white/5 rounded-2xl">
                <div class="flex items-center gap-4">
                    <img src="${p.img}" class="w-12 h-12 rounded-lg object-cover ${p.soldOut ? 'grayscale' : ''}">
                    <span class="text-[10px] font-bold uppercase ${p.soldOut ? 'text-gray-500' : ''}">${p.name}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleSold(${p.id})" class="text-[8px] font-black px-3 py-2 rounded-lg border ${p.soldOut ? 'bg-yellow-500 text-black border-yellow-500' : 'text-yellow-500 border-yellow-500/20'}">
                        ${p.soldOut ? 'MARK AVAILABLE' : 'MARK SOLD'}
                    </button>
                    <button onclick="deleteProduct(${p.id})" class="bg-red-500/10 text-red-500 p-2 rounded-lg text-xs">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function loadHooks() {
        document.getElementById('contact-hooks').innerHTML = `
            <a href="https://wa.me/${identity.wa}" target="_blank" class="text-[9px] font-black text-gray-600 hover:text-yellow-500 transition-all tracking-[0.2em] block uppercase">WhatsApp</a>
            <a href="https://instagram.com/${identity.ig}" target="_blank" class="text-[9px] font-black text-gray-600 hover:text-yellow-500 transition-all tracking-[0.2em] block uppercase">Instagram</a>
            <a href="${identity.fb}" target="_blank" class="text-[9px] font-black text-gray-600 hover:text-yellow-500 transition-all tracking-[0.2em] block uppercase">Facebook</a>
        `;
    }

    function saveDB() { localStorage.setItem('naqsh_prods', JSON.stringify(products)); }
    window.onload = () => { loadHooks(); navigate('home'); }
</script>
</body>
</html>
