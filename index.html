<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | Global Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --accent: #d4af37; --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); }

        body { background-color: #030303; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }

        /* --- PERFECT LOGO CIRCLE FIX --- */
        .logo-frame {
            position: relative;
            width: 130px; height: 130px;
            margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-ring {
            position: absolute; inset: 0;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }
        .logo-img-container {
            width: 105px; height: 105px;
            background: #000;
            border-radius: 50%;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 5;
            padding: 5px; /* Is se logo edge se door rahega */
        }
        .logo-img-container img {
            width: 100%; height: 100%;
            object-fit: contain; /* Pora fit ayega bina katay */
            border-radius: 50%;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- UI ELEMENTS --- */
        .sidebar { height: 100vh; width: 280px; position: fixed; left: 0; top: 0; background: #080808; border-right: 1px solid #1a1a1a; z-index: 1000; }
        .main-content { margin-left: 280px; padding: 40px; }
        
        .nav-link { padding: 15px 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; display: block; font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #555; text-transform: uppercase; }
        .nav-link:hover { background: rgba(212,175,55,0.05); color: var(--accent); }

        input { background: #000 !important; border: 1px solid #222 !important; color: white !important; padding: 14px; border-radius: 15px; width: 100%; margin-bottom: 12px; font-size: 12px; }
        input:focus { border-color: var(--accent) !important; outline: none; }

        .gold-btn { background: var(--gold-grad); color: #000; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; transition: 0.4s; }
        .gold-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        #login-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 9999; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="login-modal">
    <div class="bg-[#0a0a0a] border border-yellow-500/20 p-12 rounded-[40px] w-96 text-center animate__animated animate__zoomIn">
        <h2 style="font-family: 'Syncopate';" class="text-yellow-500 text-sm mb-8">SECURE_ACCESS</h2>
        <input type="text" id="admin-user" placeholder="USERNAME">
        <input type="password" id="admin-pass" placeholder="PASSWORD">
        <button onclick="attemptLogin()" class="w-full gold-btn py-4 rounded-2xl mt-4">INITIALIZE</button>
        <button onclick="closeLogin()" class="text-gray-600 text-[10px] mt-6 uppercase tracking-widest block w-full text-center">Abort</button>
    </div>
</div>

<aside class="sidebar p-8 flex flex-col justify-between">
    <div>
        <div class="logo-frame mb-8">
            <div class="logo-ring"></div>
            <div class="logo-img-container">
                <img src="https://instagram.fkhi16-2.fna.fbcdn.net/v/t51.2885-19/624808014_17848151646670722_8018140761805361040_n.jpg?efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby41MDAuYzIifQ&_nc_ht=instagram.fkhi16-2.fna.fbcdn.net&_nc_cat=106&_nc_oc=Q6cZ2QFp6joj10hXacsfbmyNwTBvjFRRAzMqn8-2kV_K6zRGRt-cRVAMK7tIJhGARkcVFTo&_nc_ohc=DVcveLJJ5coQ7kNvwG2EN4E&_nc_gid=8xKqzyeYLcmmLWk70EzmUA&edm=AP4sbd4BAAAA&ccb=7-5&oh=00_Afr6VGRgrtFaz5bJRLl8ZHAPHQa4f8Yy36XCUG4pI-bpTQ&oe=69814903&_nc_sid=7a9f4b" alt="Naqsh Logo">
            </div>
        </div>
        <h1 style="font-family: 'Syncopate';" class="text-center text-yellow-500 font-bold tracking-[0.5em] text-[10px] mb-12">NAQSH</h1>
        
        <nav class="space-y-2">
            <a onclick="showPage('home')" class="nav-link">01. Home</a>
            <a onclick="showPage('gallery')" class="nav-link">02. Gallery</a>
            <a onclick="openAdmin()" class="nav-link mt-12 opacity-30 hover:opacity-100">⚙️ System Control</a>
        </nav>
    </div>
    
    <div id="sidebar-links" class="space-y-4 pb-10 border-t border-white/5 pt-6"></div>
</aside>

<main class="main-content">
    <section id="home-page" class="animate__animated animate__fadeIn">
        <div class="h-[80vh] rounded-[50px] bg-zinc-900 overflow-hidden relative flex items-center justify-center">
            <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=2000" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="relative z-10 text-center px-10">
                <h2 style="font-family: 'Syncopate';" class="text-7xl font-bold mb-8 leading-tight">THE ELITE<br>SQUAD</h2>
                <button onclick="showPage('gallery')" class="gold-btn px-16 py-5 rounded-full text-xs">Explore Vault</button>
            </div>
        </div>
    </section>

    <section id="gallery-page" class="hidden animate__animated animate__fadeIn">
        <h2 style="font-family: 'Syncopate';" class="text-4xl font-bold mb-12 text-yellow-500 tracking-tighter">VAULT_ASSETS</h2>
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </section>

    <section id="admin-page" class="hidden animate__animated animate__fadeIn">
        <div class="flex justify-between items-center mb-16">
            <h2 style="font-family: 'Syncopate';" class="text-3xl font-bold uppercase">Management Panel</h2>
            <button onclick="showPage('home')" class="bg-red-500/10 text-red-500 px-8 py-3 rounded-full text-[10px] font-black">LOGOUT</button>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <div class="bg-[#0a0a0a] p-10 rounded-[40px] border border-white/5 h-fit">
                <h3 class="text-xs font-bold text-yellow-500 mb-8 uppercase tracking-[0.2em]">Add New Asset</h3>
                <input type="text" id="p-name" placeholder="Shoe Model">
                <input type="text" id="p-price" placeholder="Price (e.g. 8,500 PKR)">
                <input type="text" id="p-img" placeholder="Image Link">
                <button onclick="saveItem()" class="w-full gold-btn py-4 rounded-2xl mt-4">Save to Database</button>
            </div>
            <div class="lg:col-span-2 bg-[#0a0a0a] p-10 rounded-[40px] border border-white/5">
                <h3 class="text-xs font-bold text-gray-500 mb-8 uppercase tracking-[0.2em]">Live Inventory</h3>
                <div id="admin-list" class="space-y-4"></div>
            </div>
        </div>
    </section>
</main>

<script>
    let inventory = JSON.parse(localStorage.getItem('naqsh_data')) || [];
    let social = { wa: "0370168186", ig: "naqshshoes", fb: "naqshshoes" };

    function showPage(id) {
        ['home', 'gallery', 'admin'].forEach(p => {
            document.getElementById(p + '-page').classList.add('hidden');
        });
        document.getElementById(id + '-page').classList.remove('hidden');
        if(id === 'gallery') renderGallery();
        if(id === 'admin') renderAdminList();
    }

    // Admin Access
    function openAdmin() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeLogin() { document.getElementById('login-modal').style.display = 'none'; }
    function attemptLogin() {
        const u = document.getElementById('admin-user').value;
        const p = document.getElementById('admin-pass').value;
        if(u === "NaqshShoes" && p === "Gixxer1000") {
            closeLogin();
            showPage('admin');
        } else { alert("ACCESS DENIED"); }
    }

    // Data Management
    function saveItem() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const img = document.getElementById('p-img').value;
        if(name && price && img) {
            inventory.unshift({ id: Date.now(), name, price, img });
            localStorage.setItem('naqsh_data', JSON.stringify(inventory));
            renderAdminList();
            alert("Asset Saved!");
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-img').value = '';
        }
    }

    function deleteItem(id) {
        inventory = inventory.filter(i => i.id !== id);
        localStorage.setItem('naqsh_data', JSON.stringify(inventory));
        renderAdminList();
    }

    function renderGallery() {
        const grid = document.getElementById('product-grid');
        if(inventory.length === 0) { grid.innerHTML = "<p class='text-gray-600 uppercase text-xs tracking-widest'>No stock available.</p>"; return; }
        grid.innerHTML = inventory.map(item => `
            <div class="bg-[#0d0d0d] rounded-[40px] overflow-hidden border border-white/5 transition hover:border-yellow-500/30">
                <img src="${item.img}" class="w-full h-80 object-cover">
                <div class="p-8">
                    <h3 class="text-sm font-black uppercase mb-2 tracking-widest">${item.name}</h3>
                    <p class="text-yellow-500 font-bold mb-6">${item.price}</p>
                    <a href="https://wa.me/${social.wa}?text=I want to buy: ${item.name}" target="_blank" class="block text-center border border-white/10 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-black transition">Order via WA</a>
                </div>
            </div>
        `).join('');
    }

    function renderAdminList() {
        const list = document.getElementById('admin-list');
        list.innerHTML = inventory.map(item => `
            <div class="flex items-center justify-between p-4 bg-black/40 border border-white/5 rounded-2xl">
                <div class="flex items-center gap-4">
                    <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover">
                    <span class="text-[10px] font-bold uppercase tracking-widest">${item.name}</span>
                </div>
                <button onclick="deleteItem(${item.id})" class="text-red-500 text-[10px] font-bold px-4">DELETE</button>
            </div>
        `).join('');
    }

    function renderSidebar() {
        document.getElementById('sidebar-links').innerHTML = `
            <a href="https://wa.me/${social.wa}" class="text-[9px] font-black opacity-30 hover:opacity-100 uppercase tracking-widest block transition">WhatsApp</a>
            <a href="https://instagram.com/${social.ig}" class="text-[9px] font-black opacity-30 hover:opacity-100 uppercase tracking-widest block transition">Instagram</a>
            <a href="https://facebook.com/${social.fb}" class="text-[9px] font-black opacity-30 hover:opacity-100 uppercase tracking-widest block transition">Facebook</a>
        `;
    }

    window.onload = () => { renderSidebar(); showPage('home'); }
</script>
</body>
</html>
