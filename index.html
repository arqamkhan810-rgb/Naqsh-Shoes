<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | Ultra Pro Max UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --accent: #d4af37; --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); }
        body { background-color: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }

        /* --- ULTRA PRO MAX ANIMATIONS --- */
        .glass-sidebar {
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(80px);
            border-right: 1px solid rgba(212, 175, 55, 0.1);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card {
            background: #0a0a0a; border-radius: 40px; border: 1px solid rgba(255,255,255,0.02);
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* SOLD OUT LAYER */
        .sold-out-filter { filter: grayscale(1) contrast(1.2) brightness(0.4); transition: 0.8s; }
        .sold-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            border: 4px solid #ff0000; color: #ff0000; padding: 10px 30px;
            font-family: 'Syncopate'; font-weight: 900; font-size: 20px;
            z-index: 60; pointer-events: none; opacity: 0.9;
            box-shadow: 0 0 30px rgba(255,0,0,0.2);
        }

        /* MAGNETIC BUTTON */
        .gold-btn {
            background: var(--gold-grad); color: #000; font-weight: 900;
            text-transform: uppercase; letter-spacing: 3px; position: relative;
            overflow: hidden; transition: 0.5s;
        }
        .gold-btn:hover { letter-spacing: 5px; transform: translateY(-5px); box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3); }

        /* GLITCH EFFECT */
        .glitch-text:hover { animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        input {
            background: #080808 !important; border: 1px solid #1a1a1a !important;
            color: white !important; padding: 20px; border-radius: 20px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus { border-color: var(--accent) !important; transform: scale(1.02); box-shadow: 0 0 30px rgba(212,175,55,0.1); }

        .nav-link { 
            font-size: 11px; letter-spacing: 4px; color: #444; 
            transition: 0.4s; position: relative; cursor: pointer;
        }
        .nav-link:hover, .nav-link.active { color: var(--accent); padding-left: 15px; }

        /* SCROLLBAR CUSTOMIZATION */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

<div id="login-overlay" class="fixed inset-0 bg-black/98 z-[9999] hidden flex items-center justify-center backdrop-blur-3xl">
    <div class="p-12 w-[400px] text-center animate__animated animate__zoomInDown">
        <h2 style="font-family: 'Syncopate';" class="text-xl font-bold mb-10 text-yellow-500 tracking-[0.6em]">SECURE_LOGIN</h2>
        <input type="text" id="id-entry" placeholder="OPERATOR ID" class="w-full mb-4">
        <input type="password" id="key-entry" placeholder="ACCESS KEY" class="w-full mb-10">
        <button onclick="unlockSystem()" class="w-full gold-btn py-5 rounded-2xl">Initialize Terminal</button>
        <button onclick="closeLogin()" class="mt-8 text-gray-700 text-[10px] tracking-widest uppercase block w-full hover:text-white transition">Abort_Session</button>
    </div>
</div>

<aside class="glass-sidebar w-[320px] h-screen fixed left-0 top-0 p-12 flex flex-col justify-between z-[1000]">
    <div class="animate__animated animate__fadeInLeft">
        <div class="relative w-36 h-36 mx-auto mb-10 group">
            <div class="absolute inset-0 border-2 border-dashed border-yellow-500/20 rounded-full group-hover:rotate-180 transition-transform duration-1000"></div>
            <div class="absolute inset-3 bg-black rounded-full overflow-hidden border border-white/5">
                <img src="https://i.ibb.co/fYfsCKx1/Elegant-Wordmark-Logo-for-Naqsh-Shoes.png" class="w-full h-full object-cover">
            </div>
        </div>
        <h1 style="font-family: 'Syncopate';" class="text-center text-yellow-500 font-bold tracking-[0.5em] text-[12px] mb-20 glitch-text">NAQSH SHOES</h1>
        
        <nav class="space-y-10">
            <a onclick="navigate('home')" id="nav-home" class="nav-link active block uppercase">01 // Home</a>
            <a onclick="navigate('gallery')" id="nav-gallery" class="nav-link block uppercase">02 // Vault</a>
            <a onclick="openLogin()" class="nav-link block uppercase mt-32 opacity-20 hover:opacity-100 transition-opacity">03 // System</a>
        </nav>
    </div>

    <div id="contact-hooks" class="space-y-5 pb-10 border-t border-white/5 pt-10"></div>
</aside>

<main class="ml-[320px] p-16">
    <section id="home-sec" class="page-sec">
        <div class="h-[85vh] rounded-[80px] relative overflow-hidden flex items-center p-20 group animate__animated animate__fadeIn">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1549298916-b41d501d3772?q=80&w=2000')] bg-cover bg-center group-hover:scale-110 transition-transform duration-[10s]"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-black via-black/40 to-transparent"></div>
            <div class="relative z-10 max-w-2xl">
                <span class="text-yellow-500 font-bold tracking-[1.5em] text-[10px] uppercase mb-8 block animate__animated animate__fadeInDown">Artisanal Footwear</span>
                <h2 style="font-family: 'Syncopate';" class="text-9xl font-black mb-12 leading-none animate__animated animate__fadeInLeft">WALK<br>BOLD</h2>
                <button onclick="navigate('gallery')" class="gold-btn px-20 py-7 rounded-full text-[10px]">Access The Vault</button>
            </div>
        </div>
    </section>

    <section id="gallery-sec" class="page-sec hidden">
        <div class="mb-16 flex justify-between items-end animate__animated animate__fadeIn">
            <div>
                <span class="text-yellow-500 text-[10px] tracking-[0.5em] font-bold uppercase">Collection 2026</span>
                <h2 style="font-family: 'Syncopate';" class="text-5xl font-bold">THE_INVENTORY</h2>
            </div>
        </div>
        <div id="store-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16"></div>
    </section>

    <section id="admin-sec" class="page-sec hidden">
        <div class="flex justify-between items-center mb-16">
            <h2 style="font-family: 'Syncopate';" class="text-2xl text-yellow-500">OPERATIONS_CENTER</h2>
            <button onclick="navigate('home')" class="bg-red-500/10 text-red-500 px-10 py-4 rounded-full text-[10px] font-black border border-red-500/20 hover:bg-red-500 hover:text-white transition">DISCONNECT</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
            <div class="bg-white/5 p-12 rounded-[50px] border border-white/5 animate__animated animate__fadeInLeft">
                <h3 class="text-[10px] font-black uppercase tracking-[0.4em] text-gray-500 mb-10">Inject New Asset</h3>
                <input type="text" id="shoe-name" placeholder="Asset Name" class="w-full mb-4">
                <input type="text" id="shoe-price" placeholder="Price (e.g. 8,500 PKR)" class="w-full mb-4">
                <input type="text" id="shoe-img" placeholder="Neural Link (Image URL)" class="w-full mb-10">
                <button onclick="addNewProduct()" class="w-full gold-btn py-6 rounded-2xl">Deploy Asset</button>
                
                <div id="admin-list" class="mt-16 space-y-4 max-h-[500px] overflow-y-auto pr-4"></div>
            </div>

            <div class="bg-white/5 p-12 rounded-[50px] border border-white/5 h-fit animate__animated animate__fadeInRight">
                <h3 class="text-[10px] font-black uppercase tracking-[0.4em] text-gray-500 mb-10">Neural Channels</h3>
                <div class="space-y-8">
                    <input type="text" id="set-wa" placeholder="WhatsApp Target" class="w-full">
                    <input type="text" id="set-ig" placeholder="Instagram ID" class="w-full">
                    <input type="text" id="set-fb" placeholder="Facebook Link" class="w-full">
                    <button onclick="saveIdentity()" class="w-full border-2 border-yellow-500/20 text-yellow-500 py-6 rounded-2xl font-black text-[10px] hover:bg-yellow-500 hover:text-black transition-all">Re-Sync Identity</button>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    let products = JSON.parse(localStorage.getItem('naqsh_shoes_db')) || [];
    let identity = JSON.parse(localStorage.getItem('naqsh_shoes_id')) || { wa: "0370168186", ig: "naqshshoes", fb: "#" };

    function navigate(page) {
        document.querySelectorAll('.page-sec').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(page + '-sec').classList.remove('hidden');
        document.getElementById('nav-' + page)?.classList.add('active');
        
        if(page === 'gallery') renderGallery();
        if(page === 'admin') { renderAdminList(); syncAdmin(); }
    }

    function openLogin() { document.getElementById('login-overlay').style.display = 'flex'; }
    function closeLogin() { document.getElementById('login-overlay').style.display = 'none'; }
    function unlockSystem() {
        if(document.getElementById('id-entry').value === "NaqshShoes" && document.getElementById('key-entry').value === "Gixxer1000") {
            closeLogin(); navigate('admin');
        } else { alert("NEURAL MISMATCH: Access Denied."); }
    }

    function addNewProduct() {
        const name = document.getElementById('shoe-name').value;
        const price = document.getElementById('shoe-price').value;
        const img = document.getElementById('shoe-img').value;
        if(name && price && img) {
            products.unshift({ id: Date.now(), name, price, img, sold: false });
            saveDB(); renderAdminList();
            ['shoe-name', 'shoe-price', 'shoe-img'].forEach(f => document.getElementById(f).value = '');
        }
    }

    function toggleSold(id) {
        const p = products.find(x => x.id === id);
        if(p) { p.sold = !p.sold; saveDB(); renderAdminList(); }
    }

    function deleteProduct(id) {
        if(confirm("Purge asset?")) { products = products.filter(x => x.id !== id); saveDB(); renderAdminList(); }
    }

    function renderGallery() {
        const grid = document.getElementById('store-grid');
        grid.innerHTML = products.map((p, i) => `
            <div class="product-card group p-6 animate__animated animate__fadeInUp" style="animation-delay: ${i*0.1}s" data-tilt data-tilt-max="10" data-tilt-speed="1000" data-tilt-perspective="2000">
                <div class="h-[500px] overflow-hidden rounded-[40px] relative shadow-2xl">
                    ${p.sold ? '<div class="sold-label">SOLD OUT</div>' : ''}
                    <img src="${p.img}" class="w-full h-full object-cover transition-transform duration-[3s] group-hover:scale-125 ${p.sold ? 'sold-out-filter' : ''}">
                    ${!p.sold ? `
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-all duration-500 flex items-center justify-center p-10">
                        <a href="https://wa.me/${identity.wa}?text=Inquiry for ${p.name}" target="_blank" class="gold-btn w-full py-5 rounded-2xl text-center text-[10px]">Secure Asset</a>
                    </div>` : ''}
                </div>
                <div class="mt-8 text-center">
                    <p class="text-[10px] font-bold text-gray-500 tracking-[0.5em] mb-2 uppercase">${p.name}</p>
                    <p class="text-3xl font-black ${p.sold ? 'text-gray-800' : 'text-yellow-500'}">${p.price}</p>
                </div>
            </div>
        `).join('');
        VanillaTilt.init(document.querySelectorAll(".product-card"));
    }

    function renderAdminList() {
        document.getElementById('admin-list').innerHTML = products.map(p => `
            <div class="flex items-center justify-between p-6 bg-black/40 border border-white/5 rounded-3xl">
                <div class="flex items-center gap-6">
                    <img src="${p.img}" class="w-14 h-14 rounded-2xl object-cover ${p.sold ? 'grayscale' : ''}">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-widest text-white">${p.name}</p>
                        <p class="text-yellow-500 text-xs">${p.price}</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="toggleSold(${p.id})" class="px-5 py-3 rounded-xl text-[9px] font-black transition ${p.sold ? 'bg-yellow-500 text-black' : 'border border-yellow-500/30 text-yellow-500'}">
                        ${p.sold ? 'RESTOCK' : 'MARK SOLD'}
                    </button>
                    <button onclick="deleteProduct(${p.id})" class="p-3 bg-red-500/10 text-red-500 rounded-xl">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function syncAdmin() {
        document.getElementById('set-wa').value = identity.wa;
        document.getElementById('set-ig').value = identity.ig;
        document.getElementById('set-fb').value = identity.fb;
    }

    function saveIdentity() {
        identity.wa = document.getElementById('set-wa').value;
        identity.ig = document.getElementById('set-ig').value;
        identity.fb = document.getElementById('set-fb').value;
        localStorage.setItem('naqsh_shoes_id', JSON.stringify(identity));
        loadHooks(); alert("NEURAL LINKS UPDATED");
    }

    function loadHooks() {
        document.getElementById('contact-hooks').innerHTML = `
            <a href="https://wa.me/${identity.wa}" target="_blank" class="text-[10px] font-black text-gray-600 hover:text-yellow-500 tracking-[0.4em] block uppercase">WhatsApp</a>
            <a href="https://instagram.com/${identity.ig}" target="_blank" class="text-[10px] font-black text-gray-600 hover:text-yellow-500 tracking-[0.4em] block uppercase">Instagram</a>
            <a href="${identity.fb}" target="_blank" class="text-[10px] font-black text-gray-600 hover:text-yellow-500 tracking-[0.4em] block uppercase">Facebook</a>
        `;
    }

    function saveDB() { localStorage.setItem('naqsh_shoes_db', JSON.stringify(products)); }
    window.onload = () => { loadHooks(); navigate('home'); }
</script>
</body>
</html>
