<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | The Ultimate Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { 
            --accent: #d4af37; 
            --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); 
        }

        body { 
            background-color: #030303; color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden;
            cursor: crosshair; /* Futuristic cursor */
        }

        /* 3D Rotating Border for Logo */
        .logo-container {
            position: relative;
            width: 140px; height: 140px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-outline {
            position: absolute; inset: 0;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Perfect Circle Logo */
        .logo-img {
            width: 110px; height: 110px;
            border-radius: 50%;
            object-fit: contain; /* Is se image kategi nahi, poori aayegi */
            background: #000;
            padding: 5px;
            z-index: 10;
        }

        #cursor-glow {
            width: 400px; height: 400px; background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
            position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
        }

        .sidebar { 
            height: 100vh; width: 280px; position: fixed; left: 0; top: 0; 
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(40px); 
            z-index: 1000; border-right: 1px solid rgba(212, 175, 55, 0.1); 
        }
        .main-content { margin-left: 280px; padding: 40px; }

        .nav-link { 
            padding: 18px 25px; border-radius: 25px; transition: 0.4s; 
            cursor: pointer; display: flex; align-items: center; gap: 15px;
        }
        .nav-link:hover { background: rgba(212, 175, 55, 0.1); transform: translateX(10px); }

        .gold-btn { 
            background: var(--gold-grad); color: black; font-weight: 900; 
            text-transform: uppercase; transition: 0.5s; 
            letter-spacing: 2px;
        }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .floating { animation: float 4s ease-in-out infinite; }

        .product-card {
            background: #0d0d0d; border-radius: 40px; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .product-card:hover { transform: translateY(-15px); border-color: var(--accent); }
    </style>
</head>
<body>

<div id="cursor-glow"></div>

<aside class="sidebar p-8 flex flex-col justify-between">
    <div class="floating">
        <div class="logo-container mb-6">
            <div class="logo-outline"></div>
            <img src="https://instagram.fkhi16-2.fna.fbcdn.net/v/t51.2885-19/624808014_17848151646670722_8018140761805361040_n.jpg?efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby41MDAuYzIifQ&_nc_ht=instagram.fkhi16-2.fna.fbcdn.net&_nc_cat=106&_nc_oc=Q6cZ2QFp6joj10hXacsfbmyNwTBvjFRRAzMqn8-2kV_K6zRGRt-cRVAMK7tIJhGARkcVFTo&_nc_ohc=DVcveLJJ5coQ7kNvwG2EN4E&_nc_gid=8xKqzyeYLcmmLWk70EzmUA&edm=AP4sbd4BAAAA&ccb=7-5&oh=00_Afr6VGRgrtFaz5bJRLl8ZHAPHQa4f8Yy36XCUG4pI-bpTQ&oe=69814903&_nc_sid=7a9f4b" 
                 class="logo-img"
                 onerror="this.src='https://i.postimg.cc/85z1X2fV/Elegant-Wordmark-Logo-for-Naqsh-Shoes.png'">
        </div>
        <h1 style="font-family: 'Syncopate';" class="text-center text-[11px] tracking-[0.5em] text-yellow-500 font-bold">NAQSH</h1>
        
        <nav class="space-y-4 mt-12">
            <a onclick="showSection('home')" class="nav-link"><span class="text-[10px] font-black uppercase tracking-widest">Home</span></a>
            <a onclick="showSection('products')" class="nav-link"><span class="text-[10px] font-black uppercase tracking-widest">Gallery</span></a>
            <a onclick="openAdmin()" class="nav-link mt-10 opacity-30 hover:opacity-100 transition"><span class="text-[10px] font-black uppercase tracking-widest">System</span></a>
        </nav>
    </div>
    <div id="sidebar-contacts" class="space-y-4 pb-10 border-t border-white/5 pt-6"></div>
</aside>

<main class="main-content">
    <section id="home-page">
        <div class="relative h-[85vh] rounded-[60px] overflow-hidden flex items-center justify-center bg-black">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=2000')] bg-cover bg-center opacity-50 scale-105"></div>
            <div class="relative text-center z-10 p-10">
                <h2 style="font-family: 'Syncopate';" class="text-7xl font-black text-white mb-8">LEGACY 2026</h2>
                <button onclick="showSection('products')" class="gold-btn px-16 py-5 rounded-full text-[10px]">View Stock</button>
            </div>
        </div>
    </section>

    <section id="products-page" class="hidden">
        <h2 style="font-family: 'Syncopate';" class="text-4xl font-bold mb-12">THE_VAULT</h2>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </section>
</main>

<script>
    // Cursor Tracking
    const glow = document.getElementById('cursor-glow');
    document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
    });

    let inventory = JSON.parse(localStorage.getItem('naqsh_data')) || [
        { id: 1, name: "Luxury Sneaker Alpha", price: "8,500 PKR", img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600", sold: false }
    ];

    function renderStore() {
        const container = document.getElementById('product-list');
        container.innerHTML = inventory.map(item => `
            <div class="product-card animate__animated animate__fadeInUp">
                <div class="h-80 overflow-hidden rounded-t-[40px]">
                    <img src="${item.img}" class="w-full h-full object-cover">
                </div>
                <div class="p-8">
                    <p class="text-xs tracking-widest text-gray-400 mb-2 uppercase">${item.name}</p>
                    <p class="text-yellow-500 font-bold text-xl">${item.price}</p>
                </div>
            </div>
        `).join('');
    }

    function showSection(name) {
        ['home', 'products'].forEach(s => document.getElementById(s + '-page').classList.add('hidden'));
        document.getElementById(name + '-page').classList.remove('hidden');
        if(name === 'products') renderStore();
    }

    // Logic placeholder for contacts
    function renderContacts() {
        document.getElementById('sidebar-contacts').innerHTML = `
            <a href="#" class="text-[9px] font-black opacity-30 hover:opacity-100 uppercase tracking-widest block">WhatsApp</a>
            <a href="#" class="text-[9px] font-black opacity-30 hover:opacity-100 uppercase tracking-widest block">Instagram</a>
        `;
    }

    window.onload = () => { renderContacts(); showSection('home'); }
</script>
</body>
</html>
