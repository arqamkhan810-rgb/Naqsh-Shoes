<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqsh Shoes | Premium Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { 
            --accent: #d4af37; 
            --gold-grad: linear-gradient(135deg, #d4af37 0%, #f1d57a 50%, #d4af37 100%); 
        }

        body { 
            background-color: #030303; color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden;
            cursor: crosshair;
        }

        /* --- LOGO SECTION START --- */
        .logo-wrapper {
            position: relative;
            width: 140px; height: 140px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-aura {
            position: absolute;
            width: 120px; height: 120px;
            background: var(--accent);
            filter: blur(35px);
            opacity: 0.15;
            border-radius: 50%;
        }

        .logo-outline {
            position: absolute; inset: 0;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-right-color: var(--accent);
            border-radius: 50%;
            animation: spin 4s linear infinite;
        }

        .logo-img {
            width: 115px; height: 115px;
            border-radius: 50%;
            object-fit: contain; /* Pora fit ayega bina katay */
            background: #000;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 4px; /* Space inside the circle */
            z-index: 10;
        }
        /* --- LOGO SECTION END --- */

        @keyframes spin { 100% { transform: rotate(360deg); } }

        #cursor-glow {
            width: 400px; height: 400px; background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
            position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
        }

        .sidebar { 
            height: 100vh; width: 280px; position: fixed; left: 0; top: 0; 
            background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(40px); 
            z-index: 1000; border-right: 1px solid rgba(212, 175, 55, 0.1); 
        }
        .main-content { margin-left: 280px; padding: 40px; }

        .nav-link { 
            padding: 15px 20px; border-radius: 20px; transition: 0.4s; 
            cursor: pointer; display: flex; align-items: center;
        }
        .nav-link:hover { background: rgba(212, 175, 55, 0.1); transform: translateX(8px); color: var(--accent); }

        .gold-btn { 
            background: var(--gold-grad); color: black; font-weight: 900; 
            text-transform: uppercase; transition: 0.5s; letter-spacing: 2px;
        }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .floating { animation: float 4s ease-in-out infinite; }

        .product-card {
            background: #0d0d0d; border-radius: 35px; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.5s ease;
        }
        .product-card:hover { transform: translateY(-12px); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="cursor-glow"></div>

<aside class="sidebar p-8 flex flex-col justify-between">
    <div class="floating">
        <div class="logo-wrapper mb-6">
            <div class="logo-aura"></div>
            <div class="logo-outline"></div>
            <img src="https://instagram.fkhi16-2.fna.fbcdn.net/v/t51.2885-19/624808014_17848151646670722_8018140761805361040_n.jpg?efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby41MDAuYzIifQ&_nc_ht=instagram.fkhi16-2.fna.fbcdn.net&_nc_cat=106&_nc_oc=Q6cZ2QFp6joj10hXacsfbmyNwTBvjFRRAzMqn8-2kV_K6zRGRt-cRVAMK7tIJhGARkcVFTo&_nc_ohc=DVcveLJJ5coQ7kNvwG2EN4E&_nc_gid=8xKqzyeYLcmmLWk70EzmUA&edm=AP4sbd4BAAAA&ccb=7-5&oh=00_Afr6VGRgrtFaz5bJRLl8ZHAPHQa4f8Yy36XCUG4pI-bpTQ&oe=69814903&_nc_sid=7a9f4b" 
                 class="logo-img"
                 alt="Naqsh Logo">
        </div>
        <h1 style="font-family: 'Syncopate';" class="text-center text-[10px] tracking-[0.6em] text-yellow-500 font-bold">NAQSH</h1>
        
        <nav class="space-y-3 mt-10">
            <a onclick="showSection('home')" class="nav-link"><span class="text-[9px] font-black uppercase tracking-widest">01 / Home</span></a>
            <a onclick="showSection('products')" class="nav-link"><span class="text-[9px] font-black uppercase tracking-widest">02 / Gallery</span></a>
        </nav>
    </div>

    <div id="sidebar-contacts" class="space-y-4 pb-10 border-t border-white/5 pt-6">
        <a href="https://wa.me/0370168186" target="_blank" class="text-[9px] font-black opacity-40 hover:opacity-100 uppercase tracking-widest block transition">WhatsApp</a>
        <a href="https://instagram.com/naqshshoes" target="_blank" class="text-[9px] font-black opacity-40 hover:opacity-100 uppercase tracking-widest block transition">Instagram</a>
        <a href="https://facebook.com" target="_blank" class="text-[9px] font-black opacity-40 hover:opacity-100 uppercase tracking-widest block transition">Facebook</a>
    </div>
</aside>

<main class="main-content">
    <section id="home-page" class="animate__animated animate__fadeIn">
        <div class="relative h-[85vh] rounded-[50px] overflow-hidden flex items-center justify-center bg-[#050505]">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=2000')] bg-cover bg-center opacity-40 scale-105"></div>
            <div class="relative text-center z-10 p-10">
                <span class="text-yellow-500 text-[10px] tracking-[1em] uppercase mb-4 block">New Arrival</span>
                <h2 style="font-family: 'Syncopate';" class="text-7xl font-black text-white mb-8 leading-tight">THE NEXT<br>STEP</h2>
                <button onclick="showSection('products')" class="gold-btn px-14 py-4 rounded-full text-[9px]">Explore Vault</button>
            </div>
        </div>
    </section>

    <section id="products-page" class="hidden animate__animated animate__fadeIn">
        <div class="mb-12">
            <span class="text-yellow-500 text-[9px] font-bold tracking-[0.4em] uppercase">Inventory</span>
            <h2 style="font-family: 'Syncopate';" class="text-4xl font-bold">THE_VAULT</h2>
        </div>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </section>
</main>

<script>
    // Smooth Cursor Glow
    const glow = document.getElementById('cursor-glow');
    document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
    });

    // Simple Inventory Data
    let inventory = [
        { id: 1, name: "Luxury Sneaker Alpha", price: "8,500 PKR", img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600" },
        { id: 2, name: "Midnight Urban Run", price: "7,200 PKR", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" },
        { id: 3, name: "Golden Prime High", price: "12,000 PKR", img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600" }
    ];

    function renderStore() {
        const container = document.getElementById('product-list');
        container.innerHTML = inventory.map((item, idx) => `
            <div class="product-card p-4 animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.1}s">
                <div class="h-80 overflow-hidden rounded-[25px] mb-6">
                    <img src="${item.img}" class="w-full h-full object-cover hover:scale-110 transition duration-700">
                </div>
                <div class="px-4 pb-4">
                    <h3 class="text-sm font-bold tracking-widest uppercase mb-2">${item.name}</h3>
                    <div class="flex justify-between items-center">
                        <span class="text-yellow-500 font-bold">${item.price}</span>
                        <button class="bg-white/5 hover:bg-white/10 text-[9px] px-4 py-2 rounded-lg transition">DETAILS</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function showSection(name) {
        ['home', 'products'].forEach(s => document.getElementById(s + '-page').classList.add('hidden'));
        document.getElementById(name + '-page').classList.remove('hidden');
        if(name === 'products') renderStore();
    }

    window.onload = () => { showSection('home'); }
</script>
</body>
</html>
